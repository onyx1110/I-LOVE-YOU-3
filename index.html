<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>I Love You</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #000;
        }
    </style>
</head>
<body>

    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initMatrix();
        });

        // --- POWIĘKSZONY MATRIX ---
        const fontSize = 18; // Powiększony Matrix z 14px do 18px
        let columns = Math.floor(width / fontSize);
        let drops = [];
        let activeColumns = 0;
        let matrixTimer = 0;
        let spawnInterval = 12; // Początkowy wolniejszy odstęp spawnu kresek

        function initMatrix() {
            columns = Math.floor(width / fontSize);
            drops = [];
            activeColumns = 0;
            matrixTimer = 0;
            spawnInterval = 12;
            for (let i = 0; i < columns; i++) {
                drops[i] = -1; // -1 oznacza nieaktywną kolumnę
            }
        }
        initMatrix();

        const chars = "ILOVEYOU10";

        // --- SEKWENCJA ---
        let progress = 0; 
        let matrixActive = false;
        let pulseTime = 0;

        // Matematyczne równanie serca
        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return {
                x: width / 2 + x * scale,
                y: height / 2 + y * scale
            };
        }

        function loop() {
            // Czyszczenie tła
            if (!matrixActive) {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);
            } else {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, width, height);

                // Powolne przyspieszanie dodawania nowych kresek Matrixa (zwiększanie częstotliwości z czasem)
                matrixTimer++;
                if (spawnInterval > 2 && matrixTimer % 60 === 0) {
                    spawnInterval--; // Zwiększa częstotliwość spawnowania z czasem
                }

                if (matrixTimer % spawnInterval === 0 && activeColumns < columns) {
                    let inactiveIndices = [];
                    for (let i = 0; i < columns; i++) {
                        if (drops[i] === -1) inactiveIndices.push(i);
                    }
                    if (inactiveIndices.length > 0) {
                        let randomIndex = inactiveIndices[Math.floor(Math.random() * inactiveIndices.length)];
                        drops[randomIndex] = 0;
                        activeColumns++;
                    }
                }

                // Rysowanie deszczu Matrix
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < columns; i++) {
                    if (drops[i] >= 0) {
                        const char = chars[Math.floor(Math.random() * chars.length)];
                        const x = i * fontSize;
                        const y = drops[i] * fontSize;

                        ctx.fillStyle = Math.random() > 0.5 ? '#ff2a75' : '#770022';
                        ctx.fillText(char, x, y);

                        if (y > height && Math.random() > 0.975) {
                            drops[i] = 0;
                        }
                        drops[i] += 0.2; // Zwolnione tempo spadania deszczu
                    }
                }
            }

            // Mniejsze główne serce
            const baseScale = Math.min(width, height) / 46;
            const pulse = matrixActive ? Math.sin(pulseTime) * 0.05 + 1 : 1;
            const scale = baseScale * pulse;

            // Kąty dla punktów skrajnych: Górny wcięcie (t = 0) oraz Dolny czubek (t = Math.PI)
            const topPt = getHeartPoint(0, scale);
            const bottomPt = getHeartPoint(Math.PI, scale);

            // 1. Faza początkowa: Dwa punkty na górze i dole
            if (progress < 0.15) {
                ctx.fillStyle = '#ff69b4';
                ctx.beginPath();
                ctx.arc(topPt.x, topPt.y, 7, 0, Math.PI * 2);
                ctx.arc(bottomPt.x, bottomPt.y, 7, 0, Math.PI * 2);
                ctx.fill();
            } 
            // 2. Faza łączenia: Tekst idzie od góry i dołu z obu stron naraz
            else {
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ff69b4';

                const text = "I LOVE YOU";
                const step = 0.22;
                const maxAngle = Math.min(Math.PI / 2, ((progress - 0.15) / 0.85) * (Math.PI / 2));

                // Łuki wychodzące z GÓRNEGO punktu (t = 0) w lewo i prawo
                for (let a = 0; a <= maxAngle; a += step) {
                    let ptRight = getHeartPoint(a, scale);
                    let ptLeft = getHeartPoint(-a, scale);
                    ctx.fillText(text, ptRight.x, ptRight.y);
                    ctx.fillText(text, ptLeft.x, ptLeft.y);
                }

                // Łuki wychodzące z DOLNEGO punktu (t = Math.PI) w lewo i prawo
                for (let a = 0; a <= maxAngle; a += step) {
                    let ptRight = getHeartPoint(Math.PI - a, scale);
                    let ptLeft = getHeartPoint(-Math.PI + a, scale);
                    ctx.fillText(text, ptRight.x, ptRight.y);
                    ctx.fillText(text, ptLeft.x, ptLeft.y);
                }
            }

            // Aktualizacja animacji
            if (progress < 1.0) {
                progress += 0.0029;
                if (progress >= 1.0) {
                    progress = 1.0;
                    matrixActive = true;
                }
            } else {
                pulseTime += 0.015;
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
